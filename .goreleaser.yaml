version: 2

project_name: agr

before:
  hooks:
    - go mod tidy

builds:
  - id: agr
    main: .
    binary: agr
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/rohithilluri/agent-registry/cmd.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: agr
    builds: [agr]
    name_template: "agr_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "agr_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: rohithilluri
    name: agent-registry
  name_template: "v{{ .Version }}"
  draft: false
  prerelease: auto

brews:
  - name: agr
    repository:
      owner: rohithilluri
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/rohithilluri/agent-registry"
    description: "Cross-agent registry CLI — install MCP servers, skills, slash commands, and more"
    license: MIT
    test: |
      system "#{bin}/agr", "version"
    install: |
      bin.install "agr"

nfpms:
  - id: agr
    package_name: agr
    vendor: rohithilluri
    homepage: https://github.com/rohithilluri/agent-registry
    maintainer: Rohith Illuri <rohith.illuri@gmail.com>
    description: Cross-agent registry CLI — install MCP servers, skills, slash commands, and more
    license: MIT
    formats:
      - deb
      - rpm
    contents:
      - src: README.md
        dst: /usr/share/doc/agr/README.md

sboms:
  - artifacts: archive
